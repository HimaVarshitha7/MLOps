
name: CSE Skill Gap CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: CI - Test and Train Model
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Lab 5 - CI-CD GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Train machine learning model
        run: run: python train_model.py --data CSE_Skill_Gap_Dataset_1000.csv

  cd:
    name: CD - Deploy Website
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: Lab 5 - CI-CD GitHub Actions/site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
