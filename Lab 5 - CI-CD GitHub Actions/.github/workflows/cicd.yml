
name: CSE Skill Gap CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: CI - Test and Train
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Lab 4 - CI-CD GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Train model
        run: python train_model.py --data cse_skill_gap.csv

  deploy:
    name: CD - Deploy Website
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: Lab 4 - CI-CD GitHub Actions/site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
